name: Validate and deploy RetroWave TV
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            windows:
              - 'companion/**'
              - 'scripts/**'
              - 'lively/**'
              - '.github/workflows/**'
              - '**/*.props'
              - '**/*.targets'
              - '**/NuGet.Config'
              - '**/nuget.config'
              - '**/global.json'
              - '**/packages.lock.json'
  build:
    runs-on: ubuntu-latest
    strategy:
      # Preserve diagnostics from every independent browser shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm build already runs the full TypeScript check.
      - run: pnpm test
        if: matrix.shard == 1
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # The default headless channel only needs Chromium's headless shell.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Keep one WebGL worker per machine and room for the longer visual scenarios.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && matrix.shard == 1
        with:
          path: dist
  windows:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('companion/**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify companion and installer contracts
        run: dotnet run --project companion/tests/RetroWave.Companion.Tests -c Release
      - name: Verify native application navigation and themes
        run: dotnet run --project companion/tests/RetroWave.UI.Tests -c Release
      - name: Build self-contained Windows setup
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify self-contained application and worker lifecycle
        shell: pwsh
        run: ./companion/tests/package-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: retrowave-windows
          path: artifacts/RetroWave-TV-win-x64.zip
          compression-level: 0
  deploy:
    # A skipped, unchanged Windows job is safe; a failed check must block deploy.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    needs: [changes, build, windows]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    # Publish only a freshly built installer after all checks and Pages succeed.
    needs: [build, windows, deploy]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && needs.build.result == 'success' &&
      needs.windows.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: retrowave-windows
          path: release
      - name: Publish latest Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="build-${RUN_NUMBER}"
          cat > release-notes.md <<EOF
          Download RetroWave-TV-win-x64.zip, extract it, and run RetroWave-Setup.exe.
          The unsigned Windows x64 installer includes the .NET runtime.

          [Validated build and test results](${RUN_URL})
          [Setup, lyrics and credits](https://github.com/${GH_REPO}#readme)
          EOF
          # A manually rerun job must not create a duplicate release or overwrite assets.
          if gh release view "$tag" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" release/RetroWave-TV-win-x64.zip \
              --target "$GITHUB_SHA" --title "RetroWave TV — build $RUN_NUMBER" \
              --notes-file release-notes.md --latest
          fi
